spring:
  application:
    name: inventario-mercado-zamora
  datasource:
    url: jdbc:postgresql://localhost:5432/inventario
    username: postgres
    password: "1234"
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          time_zone: America/Guayaquil
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 10m

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-secret-key-at-least-32-chars}
    expiration-ms: 3600000

server:
  port: 8080

logging:
  level:
    ec.edu.uteq.inventario: INFO
    org.springframework.cache: DEBUG
